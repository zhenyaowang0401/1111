<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eumo · 语言入口预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#1b2234;color:#f1e8f4;font:16px Arial,'Microsoft YaHei',sans-serif;padding:36px}main{max-width:1100px;margin:auto}h1{font-size:28px;margin:0 0 10px}p{color:#b9c6d9;line-height:1.7;margin:8px 0 26px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px}article{background:#263748;border:2px solid #5f6384;padding:24px;min-height:410px}h2{font-size:18px;margin:0 0 26px;color:#f5cee8}header{border-bottom:1px solid #62617f;display:flex;justify-content:space-between;padding-bottom:18px;align-items:center}.brand{color:#edb3da;font-size:24px;font-weight:bold}.version{color:#ffe7a1;font-size:13px}.setup{font-size:13px;color:#e8b3d8;letter-spacing:2px;margin-top:28px}.title{font-size:26px;font-weight:bold;margin-top:14px}.picker{position:relative;width:max-content;margin-left:auto}button{font:inherit;color:inherit;cursor:pointer}.trigger{display:flex;align-items:center;gap:10px;background:#373354;border:2px solid #9c85b0;padding:11px 14px;min-height:46px;box-shadow:3px 3px #192136}.trigger svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.chevron{margin-left:10px;color:#bcb8d0}.menu{position:absolute;right:0;top:55px;width:208px;background:#302d49;border:2px solid #b294bd;padding:5px;box-shadow:5px 5px #171c2e;z-index:1}.menu button{display:flex;width:100%;justify-content:space-between;background:none;border:0;padding:13px 12px;text-align:left}.menu button:hover,.menu button:focus-visible{background:#514361;outline:1px solid #e8b3d8}.menu button[aria-checked=true]{background:#4a3b5c;color:#ffe3ac}.hint{margin-top:88px;font-size:13px;color:#afc6cb}.note{font-size:14px;margin-top:22px}button:focus-visible{outline:2px solid #ffe3ac;outline-offset:3px}[hidden]{display:none!important}@media(max-width:700px){body{padding:20px}.compare{grid-template-columns:1fr}article{padding:18px}}
</style><main><h1>语言入口 · 两种预览</h1><p>点图标展开选择，再点语言切换。下方是独立交互预览，线上按钮暂时保持原样。</p><div class="compare">
<article><h2>A · 地球＋当前语言（推荐）</h2><header><span class="brand">Eumo <span class="version">v3</span></span><span class="version">13:54</span></header><div class="setup">鼹鼠设置</div><div class="picker" data-kind="globe"><button class="trigger" aria-expanded="true" aria-label="选择语言"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg><span class="current">简体中文</span><span class="chevron">⌄</span></button><div class="menu" role="menu" aria-label="语言"><button role="menuitemradio" data-lang="en" aria-checked="false" lang="en">English<span></span></button><button role="menuitemradio" data-lang="zh" aria-checked="true" lang="zh-CN">简体中文<span>✓</span></button></div></div><div class="title">你的鼹鼠</div><div class="hint">看得出“这里选语言”，也看得出当前用哪种。</div></article>
<article><h2>B · 文/A＋当前语言</h2><header><span class="brand">Eumo <span class="version">v3</span></span><span class="version">13:54</span></header><div class="setup">鼹鼠设置</div><div class="picker" data-kind="translate"><button class="trigger" aria-expanded="true" aria-label="选择语言"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5h12M8 2v3M5 5c0 6 6 9 8 10M11 5c0 6-6 9-9 10M13 22l4-11 5 11M15 18h5"/></svg><span class="current">简体中文</span><span class="chevron">⌄</span></button><div class="menu" role="menu" aria-label="语言"><button role="menuitemradio" data-lang="en" aria-checked="false" lang="en">English<span></span></button><button role="menuitemradio" data-lang="zh" aria-checked="true" lang="zh-CN">简体中文<span>✓</span></button></div></div><div class="title">你的鼹鼠</div><div class="hint">语言含义明确，但也可能被理解为“翻译内容”。</div></article></div><p class="note">共同规则：语言名用各自的文字；✓ 标明当前选项；选择后收起；点击外部或 Esc 关闭。保持 Eumo 的紫色像素边框。</p></main><script>
for(const picker of document.querySelectorAll('.picker')){const trigger=picker.querySelector('.trigger'),menu=picker.querySelector('.menu'),options=[...menu.querySelectorAll('button')];const close=()=>{menu.hidden=true;trigger.setAttribute('aria-expanded','false')};trigger.onclick=()=>{menu.hidden=!menu.hidden;trigger.setAttribute('aria-expanded',String(!menu.hidden));if(!menu.hidden)options.find(b=>b.getAttribute('aria-checked')==='true').focus()};for(const option of options)option.onclick=()=>{for(const b of options){const active=b===option;b.setAttribute('aria-checked',String(active));b.querySelector('span').textContent=active?'✓':''}picker.querySelector('.current').textContent=option.dataset.lang==='en'?'English':'简体中文';const article=picker.closest('article');article.querySelector('.setup').textContent=option.dataset.lang==='en'?'MOLE SETUP':'鼹鼠设置';article.querySelector('.title').textContent=option.dataset.lang==='en'?'Your mole':'你的鼹鼠';close();trigger.focus()};picker.addEventListener('keydown',e=>{if(e.key==='Escape'){close();trigger.focus()}if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();menu.hidden=false;trigger.setAttribute('aria-expanded','true');const n=options.indexOf(document.activeElement),i=e.key==='Home'?0:e.key==='End'?options.length-1:(n+(e.key==='ArrowDown'?1:-1)+options.length)%options.length;options[i].focus()}});document.addEventListener('pointerdown',e=>{if(!picker.contains(e.target))close()})}
</script></html>
